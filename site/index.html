<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВИКИ</title>
  <link rel="stylesheet" href="css/style.v3.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="logo-wrap"></div>
        <div class="titles">
          <div class="site-title"></div>
          <div class="site-ver"></div>
        </div>
      </div>
      <div class="sidebar-search">
        <div class="search-box">
          <span class="s-icon">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          </span>
          <input id="search-input" type="text" placeholder="Поиск… (Ctrl+K)" autocomplete="off">
          <span id="search-clear" class="search-clear-btn" style="display:none"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <span class="ver"></span>
        <button class="theme-btn" title="Сменить тему"></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <span class="topbar-title"></span>
      </header>
      <div class="content-area"></div>
    </div>
  </div>
  <script src="js/app.v4.js"></script>
</body>
</html>
